<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Generador de Álbumes</title>
<meta name="theme-color" content="#12172B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Álbumes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">
  <header class="topbar">
    <span class="brand">Álbumes</span>
    <span class="day-count" id="dayCount">Día —</span>
  </header>

  <section id="view-hoy" class="view">
    <div class="disc-wrap">
      <div class="disc" id="disc">
        <img id="cover" class="label" src="covers/placeholder.svg" alt="">
      </div>
    </div>

    <h1 class="title" id="albumTitle">—</h1>
    <p class="artist" id="albumArtist">—</p>
    <p class="catalog" id="albumCatalog">— · — · —</p>
    <p class="blurb" id="albumBlurb">—</p>

    <div class="rate-row" id="rateRow" aria-label="Calificar de 1 a 5">
      <button class="groove" data-v="1"></button>
      <button class="groove" data-v="2"></button>
      <button class="groove" data-v="3"></button>
      <button class="groove" data-v="4"></button>
      <button class="groove" data-v="5"></button>
    </div>

    <a id="spotifyLink" class="cta" href="#" target="_blank" rel="noopener">Escuchar en Spotify</a>
  </section>

  <section id="view-historial" class="view hidden">
    <h2 class="section-title">Historial</h2>
    <div id="historyList" class="history-list"></div>
  </section>

  <section id="view-stats" class="view hidden">
    <h2 class="section-title">Estadísticas</h2>
    <div class="stat-grid">
      <div class="stat"><span class="stat-num" id="statRated">0</span><span class="stat-label">calificados</span></div>
      <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">en el catálogo</span></div>
      <div class="stat"><span class="stat-num" id="statAvg">—</span><span class="stat-label">promedio</span></div>
    </div>
    <p class="stat-note">El desglose por género, década y origen se activa cuando el catálogo crezca más allá de este lote de prueba.</p>
  </section>

  <nav class="tabbar">
    <button class="tab active" data-view="hoy">Hoy</button>
    <button class="tab" data-view="historial">Historial</button>
    <button class="tab" data-view="stats">Stats</button>
  </nav>
</main>

<script src="app.js"></script>
</body>
</html>
